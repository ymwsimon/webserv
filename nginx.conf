	server {
		listen 127.0.0.1:8090;
		client_max_body_size 200M;
		chunked_transfer_encoding on;
		#error_page 400 phpinfo.php;
		error_page 404 /40;
		error_page 302 /a;
		error_page 405 40.html;
		#error_page 300 index.html;
		#root /data/www;
		#autoindex on;
		#location ~ ^(.+\.exe)(.*)$ {
		location ~ ^(.+\.sh)(.*)$ {
		#location ~ ^(cgi_tester)(.*)$ {
			
			root /data/www/;
			client_body_temp_path /data/www/uploads/;
			fastcgi_pass unix:/var/run/fcgiwrap.socket;
			include fastcgi.conf;
			#fastcgi_param SCRIPT_FILENAME $2;
			#fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_pass_request_body on;
			fastcgi_pass_request_headers on;
			fastcgi_param SCRIPT_FILENAME /data/www/test.sh;
			fastcgi_param REQUEST_METHOD $request_method;
			fastcgi_split_path_info ^(.+\.sh)(.*)$;
			fastcgi_param ARGS $fastcgi_path_info;
			fastcgi_param PATH_INFO $fastcgi_path_info;
			fastcgi_param ARGSA $content_length;
			fastcgi_param AFILENAME $request_filename;
			fastcgi_param ABODY $request_body_file;
			#fastcgi_param DOCUMENT_ROOT /data/www;
			#fastcgi_param SCRIPT_NAME /youpi.bla;
			#fastcgi_param DOCUMENT_ROOT $document_root;
			#fastcgi_param SCRIPT_NAME $fastcgi_script_name;
		}
		location ~ ^(.+\.exe)(.*)$ {
		#location ~ ^(cgi_tester)(.*)$ {
			
			root /data/www/;
			client_body_temp_path /data/www/uploads/;
			fastcgi_pass unix:/var/run/fcgiwrap.socket;
			include fastcgi.conf;
			#fastcgi_param SCRIPT_FILENAME $2;
			#fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param SCRIPT_FILENAME /data/www/test.sh;
			fastcgi_param REQUEST_METHOD $request_method;
			fastcgi_split_path_info ^(.+\.exe)(.*)$;
			fastcgi_param ARGS $fastcgi_path_info;
			fastcgi_param PATH_INFO $fastcgi_path_info;
			#fastcgi_param DOCUMENT_ROOT /data/www;
			#fastcgi_param SCRIPT_NAME /youpi.bla;
		}
		#location ~ ^(.+\.exe)(.*)$ {
		#location ~ ^(cgi_tester)(.*)$ {
			
		#	root /data/www/;
		#	client_body_temp_path /data/www/uploads/;
		#	fastcgi_pass unix:/var/run/fcgiwrap.socket;
		#	include fastcgi.conf;
			#fastcgi_param SCRIPT_FILENAME $2;
			#fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		#	fastcgi_param SCRIPT_FILENAME /data/www/youpi.bla;
		#	fastcgi_param REQUEST_METHOD $request_method;
			#	fastcgi_split_path_info ^(.+\.exe)(.*)$;
		#	fastcgi_param ARGS $fastcgi_path_info;
		#	fastcgi_param PATH_INFO $fastcgi_script_name;
		#	fastcgi_param DOCUMENT_ROOT /data/www;
		#	fastcgi_param SCRIPT_NAME /youpi.bla;
		#}
		location ~ ^(.+\.bla)(.*)$ {
			
			root /data/www/;
			rewrite ^(.+\.bla)(.*) /exe.sh$fastcgi_script_name;
			#rewrite ^(.+\.bla)(.*) /cgi_tester.exe$fastcgi_script_name;
			#break ;
			client_body_temp_path /data/www/uploads/;
			fastcgi_pass unix:/var/run/fcgiwrap.socket;
			include fastcgi.conf;
			fastcgi_param SCRIPT_FILENAME /data/www/youpi.bla;
			fastcgi_param REQUEST_METHOD $request_method;
			#fastcgi_param PATH_INFO $fastcgi_script_name;
			fastcgi_param PATH_INFO $fastcgi_path_info;
			fastcgi_param DOCUMENT_ROOT /data/www;
			fastcgi_param SCRIPT_NAME /youpi.bla;
		}
		location ~ ^(.+\.php)(.*)$ {
			root /data/www/;
			client_body_temp_path /data/www/uploads/;
			#fastcgi_split_path_info ^(.+\.php)(/.+)$;
			fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
			#fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
			#fastcgi_index test.php;
			#include /etc/nginx/fastcgi_params;
			include fastcgi.conf;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param REQUEST_METHOD $request_method;
			fastcgi_split_path_info ^(.+\.php)(.*)$;
			fastcgi_param PATH_INFO $fastcgi_path_info;
			index phpinfo.php;
		}
		location / {
			if ($request_method ~ ^(HEAD)$ ) {
				return 405;
			}
			if ($request_method ~ ^(POST)$ ) {
				return 405;
			}
			alias /data/www/;
			#return http://google.com;
			#try_files $uri $uri/;
			index youpi.bad_extension;
			#index index.html youpi.bad_extension;
			#try_files index.html youpi.bad_extension;
			#fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
			#dav_methods POST;
			limit_except GET POST{
				deny all;
			}
			autoindex on;
			#client_body_temp_path /data/www/uploads/;
			#client_body_in_file_only on;
			#client_body_buffer_size 5M;
			#client_max_body_size 5M;
			#proxy_pass_request_headers on;
			#proxy_set_header X-FILE $request_body_file;
			#proxy_pass http://localhost:8080/;
			#proxy_redirect off;
		}
		location /post_body {
			limit_except POST {
				deny all;
			}
			client_max_body_size 100;
		}
		location /directory {
			alias /data/www/YoupiBanane/;
			try_files $uri $uri/youpi.bad_extension = 404;
			limit_except GET {
				deny all;
			}
		}
#		location /directory {
#			limit_except GET {
#				deny all;
#			}
#			root /data/www/YoupiBanane;
#			index youpi.bad_extension;
#		}
#		location /directory/Yeah {
#			limit_except GET {
#				deny all;
#			}
#			root /data/www/YoupiBanane;
#			index index.html;
#			autoindex off;
#		}
#		location /b/c {
#			root /data/www/a/c;
#			index index.html;
#			limit_except GET POST PUT {
#				deny all;
#			}
#		}
		location /b {
			root /data/www/a/;
			autoindex on;
			return http://google.com;
			index index.html;
			limit_except GET POST PUT DELETE {
				deny all;
			}
		}
		location /b/c {
			root /data/www/a/c;
			index index.html;
			return http://google.com;
			limit_except GET POST PUT {
				deny all;
			}
		}
		location /uploads {
			#root /data/www/uploads/;
			alias /data/www/uploads;
			limit_except GET POST { deny all;}
			client_body_temp_path /data/www/uploads;
			client_body_in_file_only on;
			client_body_buffer_size 10000000;
			client_max_body_size 1000000;
			autoindex on;
			sendfile on;
			autoindex_format html;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_pass_request_headers on;
			proxy_set_header X-FILE $request_body_file;
			proxy_set_body $request_body_file;
			#proxy_pass http://127.0.0.1:8080/uploads;
			#proxy_redirect off;
		}
		#location ~ \.php$ {
		#	root /data/www/;
		#
		#	#fastcgi_split_path_info ^(.+\.php)(/.+)$;
		#	fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
			#fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
			#fastcgi_index test.php;
			#include /etc/nginx/fastcgi_params;
		#	include fastcgi.conf;
		#	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		#	fastcgi_split_path_info ^(.+\.php)(/.+)$;
		#}
	}

