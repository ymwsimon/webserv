server {
	listen 127.0.0.1:8080;
	location / {
		cgi php /usr/bin/php-cgi;
		cgi bla /home/mayeung/42/commoncore/webserv/cgi_tester;
		autoindex on;
		root /home/mayeung/42/commoncore/webserv/data/www/basic;
		allowed_method GET;
	}

	location /post_body/ {
		cgi php /usr/bin/php-cgi;
		cgi bla /home/mayeung/42/commoncore/webserv/cgi_tester;
		root /home/mayeung/42/commoncore/webserv/data/www/basic;
		autoindex on;
		max_body_size 100;
		allowed_method POST;
	}
	
	location /directory/ {
		cgi php /usr/bin/php-cgi;
		cgi bla /home/mayeung/42/commoncore/webserv/cgi_tester;
		root /home/mayeung/42/commoncore/webserv/data/www/basic/YoupiBanane;
		allowed_method GET|POST;
		index youpi.bad_extension;
	}
}

